<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cadet Tracking{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#861f41; --maroon-dk:#63162f; --orange:#e5751f;
    --paper:#f4f1ea; --card:#fff; --ink:#2a2223; --muted:#6b6161; --rule:#e2ddd2;
    --alert:#9d2235; --warn:#a85f0e; --ok:#3f6b4a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:16px/1.55 "Source Sans 3",system-ui,sans-serif}
  header{background:var(--maroon);position:sticky;top:0;z-index:5;
         box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .bar{max-width:1120px;margin:0 auto;padding:16px 22px;display:flex;
       gap:26px;align-items:center;flex-wrap:wrap}
  .mark{font:600 20px/1 "Oswald",sans-serif;letter-spacing:.06em;
        text-transform:uppercase;color:#fff;display:flex;gap:10px;align-items:center}
  .mark small{display:block;font:400 12px/1.3 "Source Sans 3";letter-spacing:0;
              text-transform:none;color:#e8cfd7;margin-top:3px}
  .shield{width:26px;height:30px;flex:none}
  nav{display:flex;gap:20px;flex:1;flex-wrap:wrap}
  nav a{color:#eddde3;text-decoration:none;padding:4px 0;
        font:600 14px/1 "Source Sans 3";letter-spacing:.02em}
  nav a.on{color:#fff;box-shadow:inset 0 -3px 0 var(--orange)}
  nav a:hover{color:#fff}
  .signout{color:#e8cfd7;font-size:14px;text-decoration:none}
  .signout:hover{color:#fff}
  main{max-width:1120px;margin:0 auto;padding:32px 22px 80px}
  h1{font:600 30px/1.1 "Oswald",sans-serif;letter-spacing:.03em;
     text-transform:uppercase;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 26px;max-width:70ch}
  section{margin-bottom:38px}
  h2{font:500 19px/1.2 "Oswald",sans-serif;letter-spacing:.04em;
     text-transform:uppercase;margin:0 0 14px}
  .scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--card);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:14.5px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
  th{font:600 12.5px/1 "Source Sans 3";letter-spacing:.08em;text-transform:uppercase;
     color:var(--maroon);background:#faf7f2}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fdfbf7}
  td.name{font-weight:600}
  .pill{font:500 12px/1 "IBM Plex Mono",monospace;padding:5px 8px;border-radius:999px;
        background:#f0ece3;color:var(--muted)}
  .pill.miss{background:#f6e3e6;color:var(--alert)}
  .pill.no{background:#fbeedd;color:var(--warn)}
  .pill.yes{background:#e7efe7;color:var(--ok)}
  .flag{color:var(--alert);font-weight:600}
  .count{font:600 38px/1 "Oswald",sans-serif;color:var(--maroon);margin-right:8px}
  .stats{display:flex;gap:44px;flex-wrap:wrap;background:var(--card);
         border:1px solid var(--rule);border-left:5px solid var(--orange);
         border-radius:10px;padding:18px 24px;margin-bottom:28px}
  .stats div span{display:block;color:var(--muted);font-size:14px}
  form.inline{display:inline}
  input[type=text],input[type=time],input[type=number],input[type=password],select{
    font:15px "Source Sans 3";padding:8px 10px;border:1px solid var(--rule);
    background:var(--card);border-radius:6px;color:var(--ink)}
  input:focus,select:focus,button:focus{outline:2px solid var(--orange);outline-offset:2px}
  button{font:600 14.5px "Source Sans 3";padding:10px 18px;border:1px solid var(--maroon);
         background:var(--maroon);color:#fff;border-radius:6px;cursor:pointer}
  button:hover{background:var(--maroon-dk);border-color:var(--maroon-dk)}
  button.ghost{background:transparent;color:var(--maroon)}
  button.ghost:hover{background:#f3e9ec;color:var(--maroon-dk)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px 26px}
  label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
  .check{display:flex;gap:9px;align-items:center;color:var(--ink);margin-top:24px}
  .msg{padding:12px 16px;border-left:4px solid var(--orange);background:var(--card);
       border:1px solid var(--rule);border-left-width:4px;border-radius:8px;margin-bottom:22px}
  .msg.error{border-left-color:var(--alert)}
  .note{color:var(--muted);font-size:14px}
  .log{font:13px/1.6 "IBM Plex Mono",monospace;white-space:pre-wrap;word-break:break-word}
  .empty{padding:30px;border:1px dashed var(--rule);color:var(--muted);
         background:var(--card);border-radius:10px}
  .hero{background:var(--maroon);color:#fff;border-radius:12px;padding:44px 40px;margin-bottom:30px}
  .hero h1{font-size:44px;color:#fff;margin-bottom:12px}
  .hero p{color:#eddde3;max-width:46ch;margin:0}
</style>
</head>
<body>
{% if session.get('ok') %}
<header><div class="bar">
  <div class="mark">
    <svg class="shield" viewBox="0 0 26 30" fill="none" aria-hidden="true">
      <path d="M13 1.5 24 5v11c0 7-5 11-11 13C7 27 2 23 2 16V5z" stroke="#e5751f" stroke-width="2"/>
      <path d="M8 15.5l3.4 3.4L18.5 11" stroke="#e5751f" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Virginia Tech Cadets<small>Cadet Tracking · Attendance reminders</small></span>
  </div>
  <nav>
    <a href="{{ url_for('status') }}" class="{{ 'on' if active=='status' }}">This week</a>
    <a href="{{ url_for('history') }}" class="{{ 'on' if active=='history' }}">History</a>
    <a href="{{ url_for('settings') }}" class="{{ 'on' if active=='settings' }}">Settings</a>
    <a href="{{ url_for('actions') }}" class="{{ 'on' if active=='actions' }}">Messages</a>
  </nav>
  <a href="{{ url_for('logout') }}" class="signout">Sign out</a>
</div></header>
{% endif %}
<main>
{% for cat, m in get_flashed_messages(with_categories=true) %}
  <p class="msg {{ 'error' if cat=='error' }}">{{ m }}</p>
{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
